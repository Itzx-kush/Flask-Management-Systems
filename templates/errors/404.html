{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px; max-width: 540px; margin: 0 auto;">
  <div style="font-size: 64px; font-weight: 800; color: var(--primary); line-height: 1;">404</div>
  <h2 style="font-size: 22px; font-weight: 700; margin: 16px 0 8px 0; color: var(--text-primary);">Page Not Found</h2>
  <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">
    The requested resource could not be found or has been relocated. Please check the URL or use sidebar navigation.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
